[project]
name = "nightreign-overlay-helper"
version = "0.10.8.dev1"
description = "Nightreign Overlay Helper is a utility program developed with PyQt6, designed to display various useful information and features while playing the game."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2",
    "opencv-python>=5",
    "pillow>=12",
    "platformdirs>=4",
    "pygame>=2",
    "pyinstaller>=6",
    "pynput>=1",
    "pyqt6>=6",
    "pywin32>=312; sys_platform == 'win32'",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["F"]

[[tool.uv.index]]
url = "https://mirrors.cloud.tencent.com/pypi/simple/"
default = true
