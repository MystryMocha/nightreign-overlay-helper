name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependency
        run: uv sync --locked

      - name: Verify native binaries
        run: uv run python scripts/verify_native.py

      - name: Lint
        run: uv run ruff check src scripts tests

      - name: Test
        run: uv run pytest -q
